# Override variables for using the solo-dev image
image:
  repository: ghcr.io/hiero-ledger/hiero-block-node-solo-dev

# solo-dev has all the plugins included in the image
plugins:
  names:

# In solo dev/e2e environments there is no pre-seeded RSA roster bootstrap file.
# Configure RSA roster bootstrap to poll the in-cluster Mirror REST service.
# This keeps proof verification enabled while avoiding BAD_BLOCK_PROOF startup loops.
blockNode:
  config:
    # Use env-style keys; dotted keys are not reliable via envFrom ConfigMap.
    ROSTER_BOOTSTRAP_RSA_MIRROR_NODE_BASE_URL: "http://mirror-1-rest"
    ROSTER_BOOTSTRAP_RSA_MIRRORNODEBASEURL: "http://mirror-1-rest"
    ROSTER_BOOTSTRAP_RSA_INITIAL_QUERY_INTERVAL_MILLIS: "5000"
    ROSTER_BOOTSTRAP_RSA_INITIALQUERYINTERVALMILLIS: "5000"
    ROSTER_BOOTSTRAP_RSA_SUBSEQUENT_QUERY_INTERVAL_MILLIS: "60000"
    ROSTER_BOOTSTRAP_RSA_SUBSEQUENTQUERYINTERVALMILLIS: "60000"
